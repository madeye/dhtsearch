name: dhtsearch

services:
  dhtsearch:
    image: ${DHTSEARCH_IMAGE:-ghcr.io/madeye/dhtsearch:latest}
    pull_policy: always
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${WEB_PORT:-3000}:3000"
      - "${API_PORT:-8080}:8080"
      - "${DHT_UDP_PORT:-6881}:6881/udp"
    environment:
      HTTP_ADDR: ":8080"
      DB_PATH: "/data/dhtsearch.db"
      DHT_PORT: "6881"
    env_file:
      - path: .env
        required: false
    volumes:
      - dhtsearch-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dhtsearch-data:
